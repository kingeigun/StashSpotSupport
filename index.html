<!DOCTYPE html>  
<html lang="zh">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>觅物记技术支持</title>  
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom, #f0f4f8, #e0e5ec);
            color: #333;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        header {
            background-color: #2d89e5;
            color: white;
            padding: 1rem 0;
            text-align: center;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            font-size: 2rem;
        }
        
        main {
            flex: 1;
            padding: 1rem;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .contact-section, .faq-section {
            background: white;
            padding: 1.5rem;
            margin: 1rem 0;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }
        
        h2 {
            font-size: 1.5rem;
            color: #2d89e5;
            margin-bottom: 0.5rem;
        }
        
        p {
            margin-bottom: 1rem;
        }
        
        ul {
            list-style-type: none;
        }
        
        ul li {
            margin-bottom: 0.5rem;
        }
        
        ul li a {
            color: #2d89e5;
            text-decoration: none;
        }
        
        ul li a:hover {
            text-decoration: underline;
        }
        
        footer {
            background-color: #2d89e5;
            color: white;
            text-align: center;
            padding: 1rem;
            font-size: 0.9rem;
            box-shadow: 0px -4px 8px rgba(0, 0, 0, 0.1);
        }
        
        footer p {
            margin: 0.5rem 0;
        }
        
        footer a {
            color: white;
            text-decoration: none;
            margin: 0 0.5rem;
        }
        
        footer a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 1.5rem;
            }
        
            h2 {
                font-size: 1.25rem;
            }
        }
    </style>
</head>  
<body>  
    <header>  
        <h1>觅物记技术支持</h1>  
    </header>  
    <main>  
        <section class="contact-section">  
            <h2>联系方式</h2>  
            <p>如果您在使用觅物记App时遇到任何问题或需要技术支持，请通过以下方式联系我们：</p>  
            <ul>  
                <li>邮箱：<a href="mailto:jinyiqun1999@outlook.com">jinyiqun1999@outlook.com</a></li>  
                <li>联系人：金艺群</li>  
                <li>支持时间：周一至周五 9:00 - 18:00 (GMT+8)</li>  
            </ul>  
        </section>  

        <section class="faq-section">  
            <h2>常见问题</h2>  
            <p>在这里可以找到常见问题的解答，帮助您快速解决遇到的疑问：</p>  
            <ul>  
                <li>更换设备后图片无法显示？请在设置页面中尝试按下iCloud同步。</li>  
            </ul>  
        </section>  
    </main>  
    <footer>  
        <p>版权所有 &copy; 2024 Jin Yiqun 保留所有权利。</p>  
    </footer>  
</body>  
</html>
